name: Verificação
on: [push, pull_request]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: APP/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  firmware-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          # Cada sketch é autocontido. Os cabeçalhos do protocolo devem evoluir juntos.
          for header in LoraProvisioning.h ProvisioningSettings.h RadioLink.h StationId.h; do
            diff -u --strip-trailing-cr "Station/$header" "AccessPoint/$header"
          done
          g++ -std=c++14 -fsyntax-only tests/soil-calibration.test.cpp
          for sketch in Station AccessPoint; do
            g++ -std=c++14 -fsyntax-only -I"$sketch" tests/station-id.test.cpp tests/provisioning.test.cpp
          done
